<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Управляете расходами или просто смотрите факт?</title>
<style>
body{margin:0;background:#f5f2ec;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px 16px 32px} .brand{font-size:12px;margin-bottom:20px}
.progress{height:5px;background:#e5e0d8;border-radius:6px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:#242424;width:0;transition:.25s}
.card{background:#fffdf9;border:1px solid #e6e0d7;border-radius:22px;padding:24px 20px;box-shadow:0 5px 20px #00000008}
.kicker{font-size:13px;color:#77736d;margin-bottom:10px} h1,h2{line-height:1.15;margin:0 0 14px}
.question{font-size:20px;font-weight:650;line-height:1.3;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e6e0d7;border-radius:15px;padding:14px 15px;margin:9px 0;font-size:15px;line-height:1.35;color:#242424}
.option:active{transform:scale(.99)} .small{font-size:13px;color:#77736d;line-height:1.45;margin-top:14px}
.advice{background:#eee9e0;border-radius:16px;padding:16px;margin-top:14px}
.primary{width:100%;border:0;background:#242424;color:#fff;border-radius:15px;padding:15px;font-size:16px;font-weight:650;margin-top:16px}
</style></head><body><div class="wrap"><div class="brand">Финансы без тумана</div>
<div class="progress"><i id="bar"></i></div><div id="app"></div></div>
<script>
const qs=[{"q": "Когда вы обычно узнаёте, что расходы отклоняются от плана?", "o": [["Ещё в течение месяца, пока на ситуацию можно повлиять", 2], ["Когда получаю промежуточный отчёт", 1], ["После закрытия месяца, когда вижу факт", 0], ["Обычно узнаю уже постфактум, когда проблема стала очевидной", 0]]}, {"q": "Если расходы отклонились от плана, понимаете ли вы масштаб отклонения?", "o": [["Да, вижу отклонение в деньгах и понимаю, насколько оно существенно", 2], ["Вижу, что есть отклонение, но не всегда понимаю его влияние", 1], ["Обычно вижу только сам факт перерасхода", 0], ["Размер отклонения приходится отдельно выяснять", 0]]}, {"q": "Если расходы выросли, можете ли вы понять, что именно произошло?", "o": [["Да, могу разделить влияние цены и объёма", 2], ["Обычно понимаю причину, но не всегда могу разложить её точно", 1], ["Вижу рост расходов, но причина остаётся на уровне предположений", 0], ["Для этого мне нужен отдельный анализ", 0]]}, {"q": "Если расход произошёл раньше плана, вы это замечаете?", "o": [["Да, вижу такие ситуации ещё в течение месяца", 2], ["Обычно замечаю по промежуточному отчёту", 1], ["Узнаю об этом уже после закрытия периода", 0], ["Раньше вообще не смотрел на расходы с точки зрения сроков", 0]]}, {"q": "Если расход существенно отклонился от плана, что происходит дальше?", "o": [["Сразу выясняем причину и решаем, что с ней делать", 2], ["Причину выясняем, если отклонение достаточно большое", 1], ["Обычно финансовый директор объясняет её уже после закрытия месяца", 0], ["Сам факт фиксируется, но до причины дело не всегда доходит", 0]]}, {"q": "Как вы понимаете, что перерасход — это не разовая ситуация?", "o": [["Смотрю динамику и вижу повторяющиеся отклонения", 2], ["Обычно это становится понятно после нескольких периодов", 1], ["Узнаю об этом, когда проблема уже повторилась несколько раз", 0], ["Специально не отслеживаем", 0]]}, {"q": "Когда вы понимаете влияние перерасхода на прибыль?", "o": [["Ещё в течение периода, пока решение можно изменить", 2], ["На этапе промежуточного анализа", 1], ["Когда вижу итоговый финансовый результат", 0], ["Обычно отдельно это не связываем", 0]]}, {"q": "Если расходы вышли за план, понятно ли, кто должен что-то изменить?", "o": [["Да, у каждого существенного отклонения есть понятный ответственный", 2], ["Обычно понятно, кто отвечает, но не всегда", 1], ["Ответственного определяем уже после выяснения причины", 0], ["Часто остаётся непонятно, кто должен что-то делать", 0]]}, {"q": "Что происходит с отклонением после того, как его обнаружили?", "o": [["Возвращаемся к нему и проверяем, устранена ли причина", 2], ["Смотрим на него в следующем месяце, если проблема повторилась", 1], ["Обычно разобрали — и пошли дальше", 0], ["К прошлым отклонениям практически не возвращаемся", 0]]}, {"q": "Что происходит после анализа расходов?", "o": [["Принимаем конкретное решение и меняем ситуацию ещё в текущем периоде", 2], ["Решение принимаем, если отклонение существенное", 1], ["Решение появляется уже после закрытия месяца", 0], ["Отчёт посмотрели, причины обсудили — дальше каждый работает как раньше", 0]]}]; let n=0,score=0;
const app=document.getElementById('app'),bar=document.getElementById('bar');
function render(){
 if(n===qs.length) return result();
 bar.style.width=(n/qs.length*100)+'%'; const x=qs[n];
 app.innerHTML='<div class="card"><div class="kicker">Вопрос '+(n+1)+' из '+qs.length+
 '</div><div class="question">'+x.q+'</div>'+
 x.o.map((a,i)=>'<button class="option" onclick="ans('+i+')">'+a[0]+'</button>').join('')+
 '<div class="small">Выберите вариант, который ближе всего к тому, как это происходит у вас сейчас.</div></div>';
}
function ans(i){score+=qs[n].o[i][1];n++;render();}
function result(){
 bar.style.width='100%'; let title,body,advice;
 if(score>=16){
 title='Вы видите отклонения, пока ещё можете на них повлиять';
 body='По вашим ответам контроль расходов у вас не заканчивается на итоговом отчёте. Вы замечаете отклонения достаточно рано, разбираете причины и связываете цифры с управленческими действиями.';
 advice='Заранее определите, какие отклонения требуют обязательного решения. Тогда отчётность будет не просто показывать ситуацию, а запускать действие.';
 } else if(score>=9){
 title='Вы видите проблему, но часто уже после того, как она произошла';
 body='По вашим ответам расходы и отклонения вам в целом видны, но значительная часть информации появляется уже в промежуточном или итоговом отчёте. Причину ещё можно разобрать, но возможность повлиять на расход уже могла быть упущена.';
 advice='Выберите 3–5 действительно значимых статей расходов и начните смотреть их ещё до закрытия месяца. Не всё нужно контролировать ежедневно. Важно раньше увидеть то, на что ещё можно повлиять.';
 } else {
 title='Вы в основном узнаёте о проблеме постфактум';
 body='По вашим ответам финансовый отчёт скорее фиксирует то, что уже произошло, чем помогает управлять расходами в процессе. Проблема становится видна тогда, когда изменить ситуацию уже сложнее.';
 advice='Начните с одного простого правила: если расход заметно отклоняется от плана, вы должны узнать об этом до окончания месяца. Сначала научитесь видеть отклонение вовремя — усложнять систему можно потом.';
 }
 app.innerHTML='<div class="card"><div class="kicker">Ваш результат</div><h2>'+title+'</h2><p>'+body+
 '</p><div class="kicker" style="margin-top:22px">Что важно сделать</div><div class="advice"><p style="margin:0">'+advice+
 '</p></div><p><strong>Главное:</strong> финансовый контроль начинается не тогда, когда вы увидели цифру в отчёте. Он начинается тогда, когда вы ещё можете что-то изменить.</p>'+
 '<div class="small">Результат теста: '+score+' из 20</div><button class="primary" onclick="location.reload()">Пройти ещё раз</button></div>';
}
render();
</script></body></html>
